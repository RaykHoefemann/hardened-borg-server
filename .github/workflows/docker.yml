name: Docker Build & Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write        # required to mint the Sigstore signing identity
      attestations: write    # required to publish the build attestation
      security-events: write # required to upload the Trivy SARIF report

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Derive tags, labels and OCI annotations from the pushed git tag.
      # - "type=semver,pattern={{version}}" -> version tag WITHOUT the leading
      #   "v" (git tag v0.1.0-beta.7 -> image tag 0.1.0-beta.7), the common
      #   semver convention.
      # - "type=raw,value=latest,enable=..." -> add :latest ONLY for stable
      #   releases (tags with no pre-release "-" suffix), replicating the old
      #   hand-written stable check.
      # DOCKER_METADATA_ANNOTATIONS_LEVELS=index forces the OCI annotations
      # (incl. image.description) onto the image INDEX, which is where GHCR
      # reads the description for multi-arch images.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/raykhoefemann/hardened-borg-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Hardened Borg Server
            org.opencontainers.image.description=Hardened Borg Backup Server
            org.opencontainers.image.licenses=GPL-3.0
          annotations: |
            org.opencontainers.image.title=Hardened Borg Server
            org.opencontainers.image.description=Hardened Borg Backup Server
            org.opencontainers.image.licenses=GPL-3.0

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true

      # Scans the amd64 image (Trivy's default platform on an amd64 runner,
      # unmodified here); the two architectures share a Dockerfile and an apt
      # install pinned to the same package versions (Dockerfile), so they do
      # not carry different vulnerabilities.
      #
      # Two runs against the same digest, not one, because they answer
      # different questions and fail the build in different ways:
      #   - This one is the full picture (every severity, fixed or not),
      #     uploaded to the Security tab so it is visible without blocking
      #     anything. It never fails the job (no exit-code set).
      #   - The gate below is deliberately narrow: CRITICAL only, and
      #     --ignore-unfixed so a CVE with no available fix cannot block a
      #     release indefinitely over something no commit here can act on
      #     (the same reasoning tests/base-image-freshness.sh's header gives
      #     for not running on pull requests -- a red build with no
      #     available fix teaches people to ignore red builds).
      - name: Vulnerability scan (report, all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/raykhoefemann/hardened-borg-server@${{ steps.push.outputs.digest }}
          scanners: vuln
          format: sarif
          output: trivy-results.sarif

      - name: Upload vulnerability report to the Security tab
        # ref/sha pin this to the commit the tag points at (which is what
        # github.sha already resolves to on a tag push), not the tag ref
        # itself. Without this, results attach to refs/tags/<tag> and the
        # Security tab's default view -- which only shows the default
        # branch -- never surfaces them; they exist but only via the API
        # with ?ref=refs/tags/<tag> explicitly. v1.1.3's own upload has
        # this problem; every release from here on does not.
        uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          sarif_file: trivy-results.sarif
          ref: refs/heads/main
          sha: ${{ github.sha }}

      - name: Vulnerability gate (fixable CRITICAL only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/raykhoefemann/hardened-borg-server@${{ steps.push.outputs.digest }}
          scanners: vuln
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Attest build provenance
        # Not pushed to the OCI registry (push-to-registry defaults to false):
        # the attestation is still uploaded to GitHub's Attestations API
        # either way, which is what "gh attestation verify" reads from by
        # default. Enabling push-to-registry additionally creates a
        # "sha256-<digest>" pseudo-tag in GHCR for every build — that entry
        # is not a real image, but GHCR's package UI lists (and can even
        # badge as "Latest") it alongside actual version tags, which is
        # confusing. Only needed if something verifies purely against the
        # registry (e.g. Kyverno/Sigstore policy-controller admission
        # checks, or `gh attestation verify --bundle-from-oci`) — not the
        # case here.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/raykhoefemann/hardened-borg-server
          subject-digest: ${{ steps.push.outputs.digest }}
