name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because one of these checks does not depend on the repository
  # changing: registry tags are deleted over time, and a documented tag can
  # stop being pullable without a single commit being made.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  wrapper-gating:
    name: borg-wrapper.sh gating & policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The suite drives the real wrapper against real Borg repositories, so
      # borgbackup is needed both as the `borg` CLI (to build fixtures) and as
      # the Python module the wrapper's encryption check imports.
      - name: Install borgbackup
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends borgbackup

      - name: Record versions
        run: |
          borg --version
          python3 --version
          python3 -c "from borg.repository import LoggedIO; print('borg module: ok')"

      - name: Run wrapper gating tests
        run: tests/wrapper-gating.sh

  shipped-image:
    name: wrapper suite inside the built image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The job above runs the wrapper against the runner's borg. The image
      # ships its own, and the two drifted apart unnoticed once "stable" moved
      # Debian from bookworm to trixie and borg from 1.2.x to 1.4.0. This job
      # exercises the wrapper as installed, against the version that actually
      # ships, so a base image bump cannot silently change what is delivered.
      - name: Build the image
        run: docker build -t borg-server:ci .

      - name: Record the shipped borg version
        run: docker run --rm --entrypoint /usr/bin/borg borg-server:ci --version

      - name: Run the gating suite against /borg-wrapper.sh
        run: |
          docker run --rm -v "$PWD/tests:/tests:ro" \
            -e WRAPPER=/borg-wrapper.sh \
            --entrypoint /bin/bash borg-server:ci /tests/wrapper-gating.sh

  host-side:
    name: build_authorized_keys.sh & host scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build_authorized_keys.sh writes to absolute paths (/config, /log,
      # /repo, /home/borg/.ssh); bubblewrap gives each case a tmpfs root with
      # the fixtures bound there, so the real script runs unmodified.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap

      - name: authorized_keys generation and input validation
        run: tests/authorized-keys-generation.sh

      - name: Host scripts (01, 09)
        run: tests/host-scripts.sh

  release-consistency:
    name: release identifiers agree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: VERSION, git tag, image tag and SOURCE_URL
        run: tests/doc-image-tags.sh consistency

  doc-image-tags:
    name: documented image tags are pullable
    runs-on: ubuntu-latest
    # Not on pushes to main. A release commit and its git tag are pushed
    # together, so this workflow starts while Docker Build & Publish is still
    # building the image for that very tag — and the check fails on a tag that
    # is minutes away from existing. Pull requests and the weekly schedule
    # still run it, so a deleted tag is still caught; only the build that could
    # never mean anything but "wait" is gone. The commit-local half of the same
    # script runs unconditionally in release-consistency above.
    if: github.event_name != 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check documented tags against GHCR
        run: tests/doc-image-tags.sh registry

  base-image-freshness:
    name: base image pin is current
    runs-on: ubuntu-latest
    # Schedule and manual dispatch only. A rebuilt base is a maintenance signal
    # about the world, not a defect in the commit under test — failing pull
    # requests for it would teach people to ignore red builds. The weekly run
    # is where it belongs, alongside the documented-tag check: both watch
    # something that changes without a commit.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare the pinned digest against the upstream tag
        run: tests/base-image-freshness.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    # Blocking. Its first run earned that: SC2178/SC2128 caught an assignment
    # to GROUPS in 09-show-all-users.sh — a built-in bash array whose
    # assignment bash silently ignores. Harmless under dash (/bin/sh on
    # Debian), broken under bash (/bin/sh on Fedora CoreOS, the platform this
    # project requires), where the script would have listed no clients at all.
    # A linter that finds a platform-specific bug on day one is not advisory.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck --severity=warning \
            borg-wrapper.sh \
            entrypoint.sh \
            build_authorized_keys.sh \
            scripts/*.sh \
            tests/*.sh
